name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Signing is optional: if the certificate secret is absent the workflow
      # still builds and releases an ad-hoc (unsigned) DMG. See docs/ci-signing.md.
      - name: Detect signing certificate
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "${CERT_P12_BASE64:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code-signing certificate found — the app will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERT_P12_BASE64 is not set — building ad-hoc (unsigned)."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          cert_path="$RUNNER_TEMP/signing.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          security import "$cert_path" -P "$CERT_PASSWORD" -f pkcs12 \
            -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null

          # Prepend the temporary keychain to the search list so codesign finds it.
          security list-keychains -d user -s "$keychain_path" \
            $(security list-keychains -d user | sed 's/[""]//g')

          # NOTE: no -v — a self-signed cert is untrusted (CSSMERR_TP_NOT_TRUSTED),
          # so it only appears under "Matching identities", not "Valid identities".
          # codesign can still sign with it.
          identity="$(security find-identity -p codesigning "$keychain_path" \
            | grep -m1 -oE '[0-9A-F]{40}')"
          if [ -z "$identity" ]; then
            echo "No code-signing identity found in the imported certificate." >&2
            exit 1
          fi

          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$cert_path"

      - name: Prepare release metadata
        id: release
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
            range="HEAD"
            summary="Initial release"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
            range="${latest_tag}..HEAD"
            summary="Changes since ${latest_tag}"
          fi

          if git rev-parse -q --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists." >&2
            exit 1
          fi

          {
            echo "tag=${next_tag}"
            echo "version=${next_tag#v}"
            echo "dmg_path=dist/CalendarWidget-${next_tag}.dmg"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Calendar Widget ${next_tag}"
            echo
            echo "${summary}"
            echo
            echo "### Changelog"
            echo
            git log --format='- %s (%h)' --reverse "$range"
          } > release-notes.md

          if ! grep -q '^- ' release-notes.md; then
            echo "- No commit messages found." >> release-notes.md
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        # CFBundleVersion must never go down between installs: Notification
        # Center keeps serving the stored timeline of a higher-numbered build
        # and the widget's buttons stop visibly working. A UTC timestamp is
        # larger than any earlier release or local build.
        run: |
          xcodebuild \
            -project CalendarWidget.xcodeproj \
            -scheme CalendarWidget \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            MARKETING_VERSION="${{ steps.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)" \
            build

      - name: Sign app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Calendar Widget.app"
          ext="$app/Contents/PlugIns/MonthWidgetExtension.appex"

          # Sign the embedded widget extension first, then the app itself,
          # re-applying each target's sandbox entitlements.
          codesign --force --timestamp=none \
            --entitlements Widget/Widget.entitlements \
            --sign "$SIGN_IDENTITY" "$ext"
          codesign --force --timestamp=none \
            --entitlements App/App.entitlements \
            --sign "$SIGN_IDENTITY" "$app"

          codesign --verify --strict --verbose=2 "$app"
          echo "Signed $app with identity $SIGN_IDENTITY"

      - name: Create DMG
        run: |
          ./scripts/create-dmg.sh \
            "build/Build/Products/Release/Calendar Widget.app" \
            "${{ steps.release.outputs.dmg_path }}"

      - name: Sign DMG
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          codesign --force --timestamp=none \
            --sign "$SIGN_IDENTITY" "${{ steps.release.outputs.dmg_path }}"
          codesign --verify --verbose=2 "${{ steps.release.outputs.dmg_path }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget-${{ steps.release.outputs.tag }}-DMG
          path: ${{ steps.release.outputs.dmg_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.dmg_path }}" \
            --target "$GITHUB_SHA" \
            --title "Calendar Widget ${{ steps.release.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
