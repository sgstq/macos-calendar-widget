name: CalendarWidget
options:
  bundleIdPrefix: me.substrata
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  CalendarWidget:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        # Shown by Finder and the widget gallery sidebar (together with
        # PRODUCT_NAME below, which must be the same string).
        CFBundleName: Calendar Widget
        CFBundleDisplayName: Calendar Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        # The on-disk name must match CFBundleName, otherwise Finder and the
        # widget gallery show the file name ("CalendarWidget") instead.
        PRODUCT_NAME: Calendar Widget
        PRODUCT_MODULE_NAME: CalendarWidget
        PRODUCT_BUNDLE_IDENTIFIER: me.substrata.calendarwidget
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MonthWidgetExtension
        embed: true

  MonthWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Calendar
        # Follow the build settings (CI overrides MARKETING_VERSION per release tag).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.substrata.calendarwidget.MonthWidget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
